<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOK · 다중기기 연결 테스트</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#253044;background:#f5f6f9}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:26px auto;padding:16px}section{background:white;border:1px solid #e2e5ec;border-radius:14px;padding:20px;margin-bottom:15px}h1{font-size:22px}h2{font-size:16px}label{display:block;font-size:13px;margin-top:12px}input,textarea{display:block;width:100%;padding:11px;border:1px solid #cbd2de;border-radius:8px;margin-top:5px;font:inherit}button{padding:10px 14px;border:0;border-radius:9px;background:#912d4d;color:white;cursor:pointer;margin-top:10px}button.secondary{background:#e9ebf1;color:#253044}button:disabled{opacity:.45}small{color:#677087}#status{white-space:pre-wrap}#list>div{border-bottom:1px solid #eee;padding:9px} .hidden{display:none!important}.error{color:#b11e35} .ok{color:#17804c} .note{background:#fff3d9;padding:12px;border-radius:8px} </style></head><body><main>
<h1>BOOK 관리자 · 1단계 연결 테스트</h1><p class="note">기존 v3.0.7.13 데이터를 변경하지 않는 별도 시험 페이지입니다. 실제 교재/재고/입출고 데이터는 아직 이전되지 않았습니다.</p>
<section id="config"><h2>연결 설정</h2><label>Supabase Project URL<input id="url" placeholder="https://xxxx.supabase.co"></label><label>Publishable/anon key<input id="key" type="password" autocomplete="off" placeholder="sb_publishable_... 또는 anon key"></label><button id="connect">연결</button><p><small>service_role/secret key는 절대 입력하지 마세요. URL과 공개 키는 이 페이지에 저장하지 않습니다.</small></p></section>
<section id="auth" class="hidden"><h2>직원 로그인</h2><label>이메일<input id="email" type="email" autocomplete="username"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><button id="login">로그인</button><button id="logout" class="secondary hidden">로그아웃</button><p id="user"></p></section>
<section id="work" class="hidden"><h2>공동 저장 테스트</h2><p><small>서로 다른 PC/휴대폰에서 같은 계정 또는 다른 직원 계정으로 열고, 저장 후 실시간 목록과 충돌 경고를 확인하세요.</small></p><label>제목<input id="title" placeholder="테스트 교재"></label><label>메모<textarea id="memo" rows="3" placeholder="테스트 기록"></textarea></label><button id="save">테스트 기록 저장</button><button id="reset" class="secondary">새 기록</button><div id="status"></div><h2>공유된 기록</h2><div id="list"></div></section>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const el=id=>document.getElementById(id);let db=null,channel=null,current=null,editing=null,revision=null;
const setStatus=(s,error=false)=>{el('status').textContent=s;el('status').className=error?'error':'ok'};
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){if(!db)return;const {data,error}=await db.from('book_pilot_records').select('id,title,memo,revision,updated_at').order('updated_at',{ascending:false}).limit(200);if(error){setStatus(error.message,true);return}el('list').innerHTML=(data||[]).map(r=>`<div><strong>${safe(r.title)}</strong> <small>v${r.revision} · ${safe(new Date(r.updated_at).toLocaleString('ko-KR'))}</small><p>${safe(r.memo)}</p><button class="secondary" data-id="${r.id}">수정</button></div>`).join('')||'<small>저장된 테스트 기록이 없습니다.</small>';el('list').querySelectorAll('button[data-id]').forEach(btn=>btn.onclick=()=>{let r=data.find(x=>x.id===btn.dataset.id);editing=r.id;revision=r.revision;el('title').value=r.title;el('memo').value=r.memo;setStatus('편집 중 · 버전 '+revision)});}
async function setupSession(){let {data:{user}}=await db.auth.getUser();current=user;el('work').classList.toggle('hidden',!user);el('logout').classList.toggle('hidden',!user);el('login').classList.toggle('hidden',!!user);el('user').textContent=user?'로그인: '+user.email:'로그인이 필요합니다.';if(channel){await db.removeChannel(channel);channel=null;}if(!user)return;const {data:profile,error:pe}=await db.from('book_staff').select('display_name,role,active').eq('user_id',user.id).maybeSingle();if(pe||!profile||!profile.active){el('work').classList.add('hidden');el('user').textContent='직원 권한이 없습니다. 관리자에게 직원 등록을 요청하세요.';return;}el('user').textContent=`${profile.display_name} · ${profile.role} · ${user.email}`;channel=db.channel('book-pilot').on('postgres_changes',{event:'*',schema:'public',table:'book_pilot_records'},()=>refresh()).subscribe();await refresh();}
el('connect').onclick=async()=>{try{const url=el('url').value.trim(),key=el('key').value.trim();if(!/^https:\/\/[^/]+\.supabase\.co\/?$/.test(url)||key.length<20)throw Error('URL 또는 공개 키 형식을 확인하세요');db=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});el('auth').classList.remove('hidden');el('connect').disabled=true;await setupSession();}catch(e){alert(e.message)}};
el('login').onclick=async()=>{if(!db)return;const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)return alert(error.message);el('password').value='';await setupSession()};
el('logout').onclick=async()=>{await db.auth.signOut();editing=null;revision=null;await setupSession()};
el('reset').onclick=()=>{editing=null;revision=null;el('title').value='';el('memo').value='';setStatus('새 기록 작성')};
el('save').onclick=async()=>{if(!db||!current)return;el('save').disabled=true;try{const {data,error}=await db.rpc('book_pilot_save',{p_id:editing,p_expected_revision:revision,p_title:el('title').value,p_memo:el('memo').value});if(error)throw error;if(data?.conflict){setStatus('동시 수정 충돌: 다른 직원의 최신 버전 '+data.current.revision+'을 먼저 확인해 주세요. 내 입력 내용은 유지됩니다.',true);await refresh();return;}if(!data?.ok)throw Error('알 수 없는 저장 실패');editing=data.record.id;revision=data.record.revision;setStatus('공동 DB 저장 완료 · v'+revision);await refresh();}catch(e){setStatus('저장 실패: '+e.message,true)}finally{el('save').disabled=false}};
</script></body></html>
